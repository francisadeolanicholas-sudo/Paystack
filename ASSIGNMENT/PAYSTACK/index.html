<!DOCTYPE html>
<html>

<head>
    <title>Paystack Dashboard</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>

<body>
    <section class="login-section">
        <div class="logo">
            <img src="paystack.svg" alt="Paystack">
        </div>
        <div class="login-box">
            <p class="login-title">SIGN IN TO YOUR ACCOUNT</p>
            <input type="email" placeholder="Email address">
            <div class="password-box">
                <input type="password" placeholder="Password">
                <i class="fa-solid fa-eye"></i>
            </div>
            <button>Sign in</button>
            <div class="login-link">
                <a href="#">Sign in with passkey</a>
            </div>
            <div class="login-link">
                <a href="#">Sign in with Single Sign-On (SSO)</a>
            </div>
        </div>
        <div class="bottom-section">
            <div>
                <span>New to Paystack?<a href="#"> Sign up</a></span>
            </div>
            <div>
                <a href="#">Forgot your password?</a>
            </div>
        </div>
        <div>
            <button class="support">
                <img src="ques.svg" alt="Question-Mark" class="ques-icon">
                <span>SUPPORT</span>
            </button>
        </div>
    </section>
</body>

</html>
